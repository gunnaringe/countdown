<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nedtelling">
<title>Nedtelling · Countdown</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preload" href="/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Apply the saved theme before first paint so the default doesn't flash.
  try {
    const theme = JSON.parse(localStorage.getItem("countdown-settings-v1"))?.theme;
    if (theme && theme !== "default") document.documentElement.dataset.theme = theme;
  } catch {}
</script>
<style>
  /* Fredoka (SIL OFL, see fonts/OFL.txt), self-hosted so the app works offline.
     One variable file per script covers every weight. */
  @font-face {
    font-family: "Fredoka";
    font-weight: 300 700;
    font-display: swap;
    src: url(/fonts/fredoka-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "Fredoka";
    font-weight: 300 700;
    font-display: swap;
    src: url(/fonts/fredoka-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --font: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --sheet: #17161f;
    --sheet-2: #211f2c;
    --line: rgba(255, 255, 255, 0.08);
    --text: #f5f3ff;
    --muted: rgba(245, 243, 255, 0.55);
    --accent: #ffd23f;
    --ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: var(--font);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  button, input { font: inherit; color: inherit; }
  input { user-select: text; -webkit-user-select: text; }
  button { cursor: pointer; }

  /* ---------- Stage ---------- */

  #stage {
    position: fixed;
    inset: 0;
    background: #000;
    cursor: pointer;
    transition: background-color 0.35s ease;
  }

  /* A circle that grows from where you tapped, then hands its color to the stage. */
  .splash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    clip-path: circle(0 at var(--x) var(--y));
    animation: splash 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes splash {
    to { clip-path: circle(150vmax at var(--x) var(--y)); }
  }

  /* ---------- Timer ---------- */

  /* Taps go through to the stage, except on the preset buttons (not inside #stage). */
  #main {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1rem, 4vmin, 2.25rem);
    padding: 1rem;
    pointer-events: none;
    /* Smaller while setting up, so the presets and hint fit below. */
    --size: min(80vw, calc(100dvh - 15rem), 40rem);
  }
  body[data-state="running"] #main,
  body[data-state="paused"] #main { --size: min(88vw, 86dvh); }
  /* Make room for the name above the ring. */
  body.named #main { --size: min(80vw, calc(100dvh - 19rem), 40rem); }
  body.named[data-state="running"] #main,
  body.named[data-state="paused"] #main { --size: min(88vw, calc(86dvh - 5rem)); }

  #label {
    max-width: 100%;
    font-size: clamp(1.5rem, 5.5vmin, 3.2rem);
    font-weight: 600;
    line-height: 1.15;
    text-align: center;
    color: rgba(255, 255, 255, 0.85);
    overflow-wrap: anywhere;
    transition: opacity 0.3s;
  }
  #label:empty { display: none; }
  body[data-state="done"] #label { opacity: 0; }

  #ring {
    position: relative;
    width: var(--size);
    height: var(--size);
    flex: none;
    transition: width 0.6s var(--ease-pop), height 0.6s var(--ease-pop), opacity 0.4s, transform 0.4s;
  }
  #ring svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #ring circle { fill: none; stroke-width: 26; }
  #ring .track { stroke: rgba(255, 255, 255, 0.08); }
  #ring .bar {
    stroke: var(--c);
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    filter: drop-shadow(0 0 18px color-mix(in srgb, var(--c) 45%, transparent));
    transition: stroke 0.3s;
  }
  #ring.empty .bar { opacity: 0; }
  /* The last ten seconds: a little heartbeat on every second. */
  #ring.beat { animation: beat 0.5s var(--ease-pop); }
  @keyframes beat { 40% { transform: scale(1.04); } }
  body[data-state="done"] #ring { opacity: 0; transform: scale(0.6); }

  #time {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-weight: 600;
    /* Shrunk from JS for long times like "12d 04:12:05". */
    font-size: calc(var(--size) * var(--fs, 0.2));
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    color: rgba(255, 255, 255, 0.92);
    transition: opacity 0.3s;
  }
  #time.hide { opacity: 0; }
  /* Past a date & time target: counting up, in the ring's color. */
  #time.over { color: var(--c); }
  body[data-state="paused"] #time { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* Preset durations, only while setting up. */
  #presets {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.7rem;
    transition: opacity 0.3s, transform 0.4s var(--ease-pop);
  }
  body:not([data-state="idle"]) #presets { opacity: 0; transform: scale(0.8); visibility: hidden; }
  #presets button {
    pointer-events: auto;
    width: 3.6rem;
    height: 3.6rem;
    border: 0;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    background: rgba(255, 255, 255, 0.1);
    font-size: 1.35rem;
    font-weight: 600;
    transition: transform 0.25s var(--ease-pop), background 0.2s, color 0.2s;
  }
  #presets button small { font-size: 0.7rem; font-weight: 500; opacity: 0.6; margin-top: 0.1rem; }
  #presets button:hover { background: rgba(255, 255, 255, 0.18); transform: scale(1.1); }
  #presets button:active { transform: scale(0.9); }
  #presets button[aria-pressed="true"] { background: var(--c); color: var(--ink); }
  #presets button svg { width: 1.3rem; height: 1.3rem; }
  #presets button.long { font-size: 1rem; }
  #presets button small { max-width: 3rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #hint {
    margin: 0;
    min-height: 1.5em;
    font-size: clamp(1.1rem, 3.2vmin, 1.6rem);
    font-weight: 500;
    color: rgba(255, 255, 255, 0.5);
    text-align: center;
    padding: 0 2rem;
    transition: opacity 0.3s;
  }
  /* Gone at once when it starts, so it can't flash while moving out of the way. */
  body[data-state="running"] #hint { opacity: 0; transition: none; }
  body.light #hint { color: rgba(0, 0, 0, 0.55); }
  body.light #hint kbd { border-color: rgba(0, 0, 0, 0.3); }
  #hint kbd {
    font-family: inherit;
    padding: 0.1em 0.7em;
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.3);
  }

  /* While running the hint is hidden, so the ring can take its space. */
  body[data-state="running"] #hint,
  body[data-state="running"] #presets,
  body[data-state="paused"] #presets { position: absolute; }
  body[data-state="paused"] #hint { position: absolute; bottom: max(1.5rem, env(safe-area-inset-bottom)); }

  /* ---------- Done ---------- */

  #done {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    font-weight: 700;
    font-size: clamp(3rem, 18vmin, 13rem);
    letter-spacing: 0.02em;
    text-align: center;
    padding: 0 1rem;
    opacity: 0;
  }
  #done small { display: block; margin-top: 0.3em; font-size: 0.32em; font-weight: 600; opacity: 0.85; }
  #done small:empty { display: none; }
  #done.show { animation: pop 0.5s var(--ease-pop) forwards, wiggle 2.4s ease-in-out 0.6s infinite; }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.6) rotate(-4deg); }
    to   { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes wiggle {
    0%, 100% { opacity: 1; transform: rotate(0) scale(1); }
    25% { opacity: 1; transform: rotate(-3deg) scale(1.04); }
    75% { opacity: 1; transform: rotate(3deg) scale(1.04); }
  }

  /* A burst of little circles when time is up. */
  .confetti {
    position: fixed;
    left: 50%;
    top: 50%;
    width: var(--s);
    height: var(--s);
    margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    border-radius: 50%;
    background: var(--c);
    pointer-events: none;
    animation: burst 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  /* Hacker theme: pixel space invaders instead of dots. */
  .confetti.invader {
    height: auto;
    aspect-ratio: var(--ar);
    border-radius: 0;
    -webkit-mask: var(--m) center / contain no-repeat;
    mask: var(--m) center / contain no-repeat;
  }
  @keyframes burst {
    0% { transform: translate(0, 0) scale(0.2); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; }
  }

  /* ---------- Floating buttons ---------- */

  #controls {
    position: fixed;
    top: max(1rem, env(safe-area-inset-top));
    right: max(1rem, env(safe-area-inset-right));
    display: flex;
    gap: 0.6rem;
    transition: opacity 0.6s;
    z-index: 5;
  }
  #controls.idle { opacity: 0.2; }
  #controls.idle:hover { opacity: 1; }

  .fab {
    width: 3.25rem;
    height: 3.25rem;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform 0.25s var(--ease-pop), background 0.2s;
  }
  .fab[hidden] { display: none; }
  .fab:hover { background: rgba(255, 255, 255, 0.24); transform: scale(1.08); }
  .fab:active { transform: scale(0.92); }
  .fab svg { width: 1.5rem; height: 1.5rem; }
  #gear svg { transition: transform 0.6s var(--ease-pop); }
  #gear:hover svg { transform: rotate(60deg); }
  #restart svg { transition: transform 0.6s var(--ease-pop); }
  #restart:hover svg { transform: rotate(-120deg); }
  #sound[aria-pressed="false"] .on,
  #sound[aria-pressed="true"] .off { display: none; }
  body.light .fab { background: rgba(0, 0, 0, 0.12); color: #111; }
  body.light .fab:hover { background: rgba(0, 0, 0, 0.2); }

  /* ---------- Settings sheet ---------- */

  #scrim {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 1rem;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
  }
  #scrim.open { opacity: 1; visibility: visible; }

  #sheet {
    width: min(100%, 30rem);
    max-height: calc(100dvh - 2rem);
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    background: linear-gradient(160deg, var(--sheet-2), var(--sheet) 60%);
    border-radius: 2.25rem;
    padding: 1.5rem 1.5rem 1.75rem;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transform: translateY(1.5rem) scale(0.94);
    transition: transform 0.4s var(--ease-pop);
    user-select: text;
    -webkit-user-select: text;
  }
  #sheet::-webkit-scrollbar { display: none; }
  #scrim.open #sheet { transform: none; }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .sheet-head h2 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .sheet-head h2 .blob {
    width: 1.1rem;
    height: 1.1rem;
    border-radius: 50%;
    background: conic-gradient(var(--c) 0 75%, rgba(255, 255, 255, 0.15) 0);
  }

  .round {
    width: 2.5rem;
    height: 2.5rem;
    flex: none;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.08);
    transition: transform 0.2s var(--ease-pop), background 0.2s, opacity 0.2s;
  }
  .round:hover { background: rgba(255, 255, 255, 0.16); transform: scale(1.08); }
  .round:active { transform: scale(0.9); }
  .round:disabled { opacity: 0.25; pointer-events: none; }
  .round svg { width: 1.1rem; height: 1.1rem; }

  section { margin-top: 1.6rem; }
  section h3 {
    margin: 0 0 0.7rem 0.4rem;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Color palette */
  .palette {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.6rem;
    justify-items: center;
    padding: 0.9rem 0.6rem;
    border-radius: 1.75rem;
    background: rgba(255, 255, 255, 0.05);
  }
  .palette button {
    width: 2.6rem;
    height: 2.6rem;
    border: 0;
    border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    display: grid;
    place-items: center;
    color: var(--ink);
    transition: transform 0.25s var(--ease-pop), box-shadow 0.2s;
  }
  .palette button:hover { transform: scale(1.15); }
  .palette button:active { transform: scale(0.9); }
  .palette button svg { width: 1.2rem; height: 1.2rem; opacity: 0; transform: scale(0.4); transition: 0.3s var(--ease-pop); }
  .palette button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sheet-2), 0 0 0 5.5px var(--c); }
  .palette button[aria-pressed="true"] svg { opacity: 1; transform: none; }

  /* Setting rows */
  .card {
    border-radius: 1.75rem;
    background: rgba(255, 255, 255, 0.05);
    padding: 0.35rem 1.1rem;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 3.4rem;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row label.text { flex: 1; font-size: 1.05rem; cursor: pointer; }
  .row .text { font-size: 1.05rem; }

  /* Pill toggle switch */
  .switch { position: relative; width: 3.4rem; height: 2rem; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch .track {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    transition: background 0.25s;
  }
  .switch .track::after {
    content: "";
    position: absolute;
    top: 0.2rem;
    left: 0.2rem;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    transition: transform 0.35s var(--ease-pop);
  }
  .switch input:checked + .track { background: #34c759; }
  .switch input:checked + .track::after { transform: translateX(1.4rem); }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent); }

  /* Segmented pill */
  .segmented {
    position: relative;
    display: inline-flex;
    padding: 0.25rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
  }
  .segmented button {
    position: relative;
    z-index: 1;
    border: 0;
    background: transparent;
    padding: 0.45rem 0.95rem;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--muted);
    transition: color 0.25s;
    white-space: nowrap;
  }
  .segmented button[aria-pressed="true"] { color: #17161f; }
  .segmented .thumb {
    position: absolute;
    top: 0.25rem;
    bottom: 0.25rem;
    border-radius: 999px;
    background: var(--accent);
    transition: left 0.35s var(--ease-pop), width 0.35s var(--ease-pop);
  }

  /* Steppers; the number can be typed in too. */
  .stepper { display: flex; align-items: center; gap: 0.5rem; }
  .stepper input {
    width: 3.2rem;
    padding: 0.3rem 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    transition: background 0.2s;
  }
  .stepper input:hover { background: rgba(255, 255, 255, 0.06); }
  .stepper input:focus { outline: none; background: rgba(255, 255, 255, 0.1); }

  /* Quick picks in settings */
  #quick-list .row { gap: 0.75rem; }
  #quick-list .edit {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.5rem 0;
    border: 0;
    background: none;
    text-align: left;
    font-size: 1.05rem;
  }
  #quick-list .edit b { font-weight: 600; font-variant-numeric: tabular-nums; }
  #quick-list .edit span { min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #quick-list .edit:hover b { color: var(--accent); }
  #quick-list .dot { width: 0.8rem; height: 0.8rem; flex: none; border-radius: 50%; background: var(--c); }
  #quick-list .add { color: var(--muted); }
  #quick-list .add .round { background: none; }

  .text-input {
    flex: 1;
    min-width: 0;
    max-width: 14rem;
    padding: 0.55rem 1rem;
    border: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    font-size: 1rem;
  }
  .text-input::placeholder { color: var(--muted); }
  .text-input:focus { outline: none; box-shadow: 0 0 0 3px var(--accent); }

  /* Dialogs (confirm, custom time) */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    padding: 1rem;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s, visibility 0.2s;
  }
  /* Visible at once when opening, so the Cancel button can take focus. */
  .modal.open { opacity: 1; visibility: visible; transition: opacity 0.2s, visibility 0s; }
  .modal .card {
    width: min(100%, 21rem);
    padding: 1.75rem 1.5rem 1.5rem;
    border-radius: 2.25rem;
    background: linear-gradient(160deg, #2a2836, #1d1c27 70%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    text-align: center;
    transform: scale(0.85);
    transition: transform 0.4s var(--ease-pop);
  }
  .modal.open .card { transform: none; }
  .modal .badge {
    width: 3.75rem;
    height: 3.75rem;
    margin: 0 auto 1rem;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #ff9dbb;
    background: rgba(255, 93, 143, 0.16);
  }
  .modal .badge svg { width: 1.75rem; height: 1.75rem; }
  #confirm[data-tone="accent"] .badge { color: var(--accent); background: rgba(255, 210, 63, 0.14); }
  #confirm.open[data-tone="danger"] .badge svg { animation: spin-back 0.7s var(--ease-pop) 0.1s; }
  #confirm .field {
    width: 100%;
    margin: -0.5rem 0 1.4rem;
    padding: 0.8rem 1.1rem;
    border: 0;
    border-radius: 999px;
    outline: 0;
    background: rgba(255, 255, 255, 0.07);
    box-shadow: inset 0 0 0 2px rgba(255, 210, 63, 0.35);
    font-size: 0.9rem;
    text-overflow: ellipsis;
    user-select: all;
    -webkit-user-select: all;
  }
  #confirm .field[hidden] { display: none; }
  #confirm .field::selection { background: rgba(255, 210, 63, 0.35); color: #fff; }
  @keyframes spin-back { from { transform: rotate(160deg); } }
  .modal h4 { margin: 0; font-size: 1.35rem; font-weight: 600; }
  .modal p { margin: 0.5rem 0 1.5rem; color: var(--muted); line-height: 1.4; }
  .modal .actions { display: flex; gap: 0.6rem; }
  .modal .actions button { flex: 1; padding: 0.8rem 1rem; }
  #custom .badge { color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
  #custom-mode { margin-top: 1rem; }
  #custom-mode[hidden], #custom .row[hidden] { display: none; }
  #custom .when label { flex: none; }
  #custom .when input { max-width: none; padding-inline: 0.8rem; font-size: 0.95rem; color-scheme: dark; }
  #custom .rows { margin: 1rem 0 1.5rem; padding: 0.35rem 0.25rem 0.35rem 1.1rem; border-radius: 1.75rem; background: rgba(255, 255, 255, 0.05); text-align: left; }
  .pill.danger { background: #ff5d8f; color: #fff; }

  #share { width: 100%; padding: 0.8rem; }

  /* Toast after loading a link */
  #toast {
    position: fixed;
    left: 50%;
    bottom: max(1.5rem, env(safe-area-inset-bottom));
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 1rem;
    max-width: calc(100vw - 2rem);
    padding: 0.5rem 0.5rem 0.5rem 1.4rem;
    border-radius: 999px;
    background: rgba(23, 22, 31, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    font-weight: 500;
    transform: translate(-50%, 200%);
    transition: transform 0.45s var(--ease-pop);
  }
  #toast.show { transform: translate(-50%, 0); }
  #toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast .pill { flex: none; padding: 0.55rem 1.1rem; }

  #install[hidden], .install-hint[hidden] { display: none; }
  .install-hint {
    margin: 1rem auto 0;
    max-width: 22rem;
    text-align: center;
    font-size: 0.85rem;
    line-height: 1.45;
    color: var(--muted);
  }
  .install-hint svg { width: 1em; height: 1em; vertical-align: -0.12em; }
  /* Already fullscreen as an installed app. */
  @media (display-mode: fullscreen) { #fullscreen { display: none; } }

  .footer { margin-top: 1.8rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; }
  .repo {
    display: flex;
    width: fit-content;
    align-items: center;
    gap: 0.45rem;
    margin: 1.1rem auto 0;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    color: var(--muted);
    font-size: 0.85rem;
    text-decoration: none;
    opacity: 0.7;
    transition: opacity 0.2s, background 0.2s, transform 0.2s var(--ease-pop);
  }
  .repo:hover { opacity: 1; background: rgba(255, 255, 255, 0.06); }
  .repo:active { transform: scale(0.95); }
  .repo:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .repo svg { width: 1rem; height: 1rem; }
  .pill {
    border: 0;
    padding: 0.7rem 1.4rem;
    border-radius: 999px;
    background: var(--accent);
    color: #17161f;
    font-weight: 600;
    transition: transform 0.25s var(--ease-pop), filter 0.2s;
  }
  .pill:hover { transform: scale(1.05); filter: brightness(1.08); }
  .pill:active { transform: scale(0.95); }
  .ghost {
    border: 0;
    padding: 0.7rem 1.4rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--muted);
    font-weight: 500;
    transition: background 0.2s, color 0.2s, transform 0.2s var(--ease-pop);
  }
  .ghost:hover { background: rgba(255, 93, 143, 0.18); color: #ff9dbb; }
  .ghost:active { transform: scale(0.95); }

  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #palette-section[hidden] { display: none; }

  /* ---------- Hacker theme ----------
     The green terminal look of clock.apphub.casa: monospace, glow, scanlines,
     square-ish corners. Same layout; everything is scoped to
     [data-theme="hacker"] so the default theme stays exactly as it is. The
     ring stays a ring. */

  [data-theme="hacker"] {
    --font: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sheet: #000;
    --sheet-2: #001a07;
    --line: rgba(0, 255, 65, 0.2);
    --text: #33ff66;
    --muted: #1fae48;
    --accent: #00ff41;
    --radius: 4px;
    --glow: 0 0 6px rgba(0, 255, 65, 0.45);
    --neon-edge: inset 0 0 0 1px rgba(0, 255, 65, 0.28);
  }
  [data-theme="hacker"] body { text-shadow: var(--glow); }
  [data-theme="hacker"] body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, 0.22) 2px 3px);
  }
  [data-theme="hacker"] ::selection { background: rgba(0, 255, 65, 0.35); color: #fff; }
  [data-theme="hacker"] input { caret-color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  /* Timer */
  [data-theme="hacker"] #ring .track { stroke: rgba(0, 255, 65, 0.1); }
  [data-theme="hacker"] #ring .bar { stroke-linecap: butt; filter: drop-shadow(0 0 10px rgba(0, 255, 65, 0.6)); }
  [data-theme="hacker"] #time { font-weight: 400; letter-spacing: -0.06em; color: var(--text); text-shadow: 0 0 18px rgba(0, 255, 65, 0.55); }
  [data-theme="hacker"] #label { color: var(--accent); }
  [data-theme="hacker"] #label::before { content: "$ "; color: var(--muted); }
  [data-theme="hacker"] #hint { color: var(--muted); }
  [data-theme="hacker"] #hint::before { content: "> "; color: var(--accent); }
  [data-theme="hacker"] #hint::after { content: "▌"; margin-left: 0.15em; color: var(--accent); animation: blink 1s steps(1) infinite; }
  [data-theme="hacker"] #hint kbd { border-radius: var(--radius); border-color: rgba(0, 255, 65, 0.45); color: var(--accent); }
  [data-theme="hacker"] #presets button { border-radius: var(--radius); background: rgba(0, 255, 65, 0.07); box-shadow: var(--neon-edge); }
  [data-theme="hacker"] #presets button:hover { background: rgba(0, 255, 65, 0.16); }
  [data-theme="hacker"] #presets button[aria-pressed="true"] { background: var(--accent); color: #000; text-shadow: none; box-shadow: 0 0 12px rgba(0, 255, 65, 0.55); }
  /* No bounce or wiggle: it just appears, like text on a terminal. */
  [data-theme="hacker"] #done.show { animation: appear 0.3s steps(3) forwards; }
  @keyframes appear { to { opacity: 1; } }
  [data-theme="hacker"] #done { color: var(--accent); text-transform: uppercase; text-shadow: 0 0 24px rgba(0, 255, 65, 0.6); }
  [data-theme="hacker"] #done span::after { content: "_"; animation: blink 1s steps(1) infinite; }
  [data-theme="hacker"] #done small { text-transform: none; color: var(--text); }

  /* Floating buttons */
  [data-theme="hacker"] .fab { border-radius: var(--radius); background: rgba(0, 255, 65, 0.1); color: var(--accent); box-shadow: var(--neon-edge); }
  [data-theme="hacker"] .fab:hover { background: rgba(0, 255, 65, 0.2); }

  /* Settings and dialogs */
  [data-theme="hacker"] #sheet,
  [data-theme="hacker"] .modal .card {
    border-radius: var(--radius);
    background: linear-gradient(160deg, var(--sheet-2), var(--sheet) 60%);
    box-shadow: 0 0 0 1px rgba(0, 255, 65, 0.35), 0 0 40px rgba(0, 255, 65, 0.12), 0 30px 80px rgba(0, 0, 0, 0.7);
  }
  [data-theme="hacker"] .sheet-head h2,
  [data-theme="hacker"] .modal h4 { color: var(--accent); }
  [data-theme="hacker"] .sheet-head h2 .blob { border-radius: 0; width: 0.6em; height: 1.1em; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: blink 1s steps(1) infinite; }
  [data-theme="hacker"] section h3::before { content: "// "; }
  [data-theme="hacker"] :is(.card, #custom .rows) { border-radius: var(--radius); background: rgba(0, 255, 65, 0.045); box-shadow: var(--neon-edge); }
  [data-theme="hacker"] :is(.round, .ghost, .pill, .segmented, .segmented button, .segmented .thumb, .text-input, .stepper input, .switch .track, .switch .track::after, #confirm .field, #toast, .repo, .modal .badge) { border-radius: var(--radius); }
  [data-theme="hacker"] :is(.round, .ghost) { background: rgba(0, 255, 65, 0.07); color: var(--accent); box-shadow: var(--neon-edge); }
  [data-theme="hacker"] .round:hover { background: rgba(0, 255, 65, 0.16); }
  [data-theme="hacker"] .ghost:hover { background: rgba(255, 77, 77, 0.15); color: #ff4d4d; }
  [data-theme="hacker"] #quick-list .add .round { box-shadow: none; }
  [data-theme="hacker"] #quick-list .dot { border-radius: 0; box-shadow: 0 0 6px var(--accent); }
  [data-theme="hacker"] .pill { color: #000; text-shadow: none; box-shadow: 0 0 14px rgba(0, 255, 65, 0.45); }
  [data-theme="hacker"] .pill.danger { background: #ff4d4d; color: #000; box-shadow: 0 0 14px rgba(255, 77, 77, 0.5); }
  [data-theme="hacker"] .text-input { background: rgba(0, 255, 65, 0.06); box-shadow: var(--neon-edge); }
  [data-theme="hacker"] .text-input:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 10px rgba(0, 255, 65, 0.35); }
  [data-theme="hacker"] .switch .track { background: rgba(0, 255, 65, 0.08); box-shadow: var(--neon-edge); }
  [data-theme="hacker"] .switch .track::after { background: var(--muted); box-shadow: none; }
  [data-theme="hacker"] .switch input:checked + .track { background: rgba(0, 255, 65, 0.28); box-shadow: inset 0 0 0 1px var(--accent); }
  [data-theme="hacker"] .switch input:checked + .track::after { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  [data-theme="hacker"] .segmented { background: rgba(0, 255, 65, 0.07); box-shadow: var(--neon-edge); }
  [data-theme="hacker"] .segmented .thumb { box-shadow: 0 0 12px rgba(0, 255, 65, 0.55); }
  [data-theme="hacker"] .segmented button[aria-pressed="true"] { color: #000; text-shadow: none; }
  [data-theme="hacker"] .modal .badge { color: #ff4d4d; background: rgba(255, 77, 77, 0.12); box-shadow: 0 0 0 1px rgba(255, 77, 77, 0.4); }
  [data-theme="hacker"] :is(#confirm[data-tone="accent"], #custom) .badge { color: var(--accent); background: rgba(0, 255, 65, 0.1); box-shadow: var(--neon-edge); }
  [data-theme="hacker"] #confirm .field { background: rgba(0, 255, 65, 0.06); box-shadow: inset 0 0 0 1px var(--accent); }
  [data-theme="hacker"] #toast { background: rgba(0, 10, 3, 0.94); box-shadow: 0 0 0 1px rgba(0, 255, 65, 0.4), 0 0 24px rgba(0, 255, 65, 0.15); }
  [data-theme="hacker"] #toast .pill { text-shadow: none; }
  [data-theme="hacker"] .repo:hover { background: rgba(0, 255, 65, 0.08); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>

      confirmReset: "Tilbakestille alt?",
      confirmResetText: "Hurtigvalg, farge og alle innstillinger går tilbake til standard.",
      cancel: "Avbryt",
      setup: "Oppsett",
      share: "Del oppsett",
      loaded: "Oppsett hentet fra lenke",
      undo: "Angre",
      copied: "Lenke kopiert!",
      linkTitle: "Del oppsettet",
      linkText: "Kopier lenken og send den til den andre enheten.",
      copy: "Kopier",
      install: "Installer appen",
      iosInstall: "Installer som app: trykk {share} Del og velg «Legg til på Hjem-skjerm».",
      red: "Rød", orange: "Oransje", yellow: "Gul", lime: "Limegrønn", green: "Grønn",
      turquoise: "Turkis", lightblue: "Lyseblå", blue: "Blå", purple: "Lilla", pink: "Rosa",
    },
    en: {
      appName: "Countdown",
      hintStart: "Press <kbd>space</kbd> or tap the screen to start",
      hintPaused: "Paused – tap to continue",
      hintDone: "Tap to start over",
      hintShow: "Press <kbd>space</kbd> or tap the screen to show it big",
      modeDuration: "Duration",
      modeTarget: "Date & time",
      when: "When",
      done: "Time's up!",
      min: "min",
      restart: "Start over",
      settings: "Settings",
      fullscreen: "Fullscreen",
      close: "Close",
      custom: "custom",
      customTitle: "Custom time",
      use: "Set",
      save: "Save",
      quickPicks: "Quick picks",
      quickPick: "Quick pick",
      add: "Add",
      remove: "Remove",
      sec: "sec",
      minutes: "Minutes",
      seconds: "Seconds",
      name: "Name",
      optional: "Optional",
      color: "Color",
      options: "Options",
      sound: "Sound when time is up",
      showTime: "Show the numbers",
      language: "Language",
      theme: "Theme", themeDefault: "Default", themeHacker: "Hacker",
      reset: "Reset everything",
      confirmReset: "Reset everything?",
      confirmResetText: "Quick picks, color and all settings go back to the defaults.",
      cancel: "Cancel",
      setup: "Setup",
      share: "Share setup",
      loaded: "Setup loaded from link",
      undo: "Undo",
      copied: "Link copied!",
      linkTitle: "Share this setup",
      linkText: "Copy the link and open it on the other device.",
      copy: "Copy",
      install: "Install app",
      iosInstall: "Install as an app: tap {share} Share, then “Add to Home Screen”.",
      red: "Red", orange: "Orange", yellow: "Yellow", lime: "Lime", green: "Green",
      turquoise: "Turquoise", lightblue: "Light blue", blue: "Blue", purple: "Purple", pink: "Pink",
    },
  };

  // Same named colors as color.apphub.casa, minus the ones a ring vanishes in.
  const PRESETS = {
    red: "#ff3b30", orange: "#ff8a00", yellow: "#ffd23f", lime: "#a3e635", green: "#34c759",
    turquoise: "#14b8a6", lightblue: "#5ac8fa", blue: "#3a86ff", purple: "#a855f7", pink: "#ff5d8f",
  };

  // Quick picks under the ring, until changed in settings.
  const QUICK = [1, 2, 3, 5, 10, 15].map((m) => ({ seconds: m * 60, name: "" }));
  const MAX_QUICK = 8;
  const MAX_SECONDS = 99 * 60 + 55;
  const MIN_SECONDS = 5;

  const defaults = () => ({
    lang: "auto",
    // The last picked time, so a reload keeps it.
    seconds: 5 * 60,
    name: "",
    // A date & time to count down to (ms), instead of `seconds`; `from` is when
    // it was picked, where the ring starts.
    target: null,
    from: null,
    quick: QUICK.map((q) => ({ ...q })),
    hex: PRESETS.yellow,
    theme: "default",
    sound: true,
    showTime: true,
  });

  const load = () => {
    const d = defaults();
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return s ? { ...d, ...s } : d;
    } catch {
      return d;
    }
  };

  // ---------- Share links ----------
  //
  // The Share button encodes the settings into the URL fragment. Opening such a
  // link applies it once — it's saved to localStorage and stripped from the
  // address bar, so bookmarks of the plain URL always get the latest setup.
  // Same idea and style as color.apphub.casa. Anything at its default is left
  // out. Format: `&`-separated `key=value`:
  //
  //   q=60~120~45_Pusse+tenner   quick picks, `~`-separated: seconds plus an
  //                              optional `_name`. Names are percent-encoded,
  //                              with `+` for spaces. `q=` means none.
  //   t=450_Lekser               the picked time, same token format
  //   d=1790000000               a date & time target instead, Unix seconds;
  //                              its name goes in `t`
  //   c=f3a                      ring color, 3/6-digit hex
  //   o=s | o=n | o=             options, only if not both on:
  //                              s = sound, n = show the numbers
  //   l=no | l=en                language. Always written — "auto" is resolved
  //                              to what the sender sees.
  //   h=1                        hacker theme (default theme if left out; `t`
  //                              is taken, unlike in color)
  //
  // Links use only letters, digits and `-_~+%&=`: chat apps and notes decide
  // where a pasted link ends, and many stop at `,` or `:` or trim trailing
  // `.!)'`, silently dropping the rest. So names escape those too. Unknown
  // keys and malformed tokens are ignored.

  const shortHex = (hex) => {
    const h = hex.slice(1).toLowerCase();
    return h[0] === h[1] && h[2] === h[3] && h[4] === h[5] ? h[0] + h[2] + h[4] : h;
  };
  const parseHex = (s) => {
    if (/^[0-9a-f]{3}$/i.test(s)) s = s.replace(/./g, "$&$&");
    return /^[0-9a-f]{6}$/i.test(s) ? `#${s.toLowerCase()}` : null;
  };
  const encName = (n) => encodeURIComponent(n)
    .replace(/[!'()*._~]/g, (ch) => `%${ch.charCodeAt(0).toString(16).toUpperCase()}`)
    .replace(/%20/g, "+");
  const decName = (n) => {
    try { return decodeURIComponent(n.replace(/\+/g, " ")); } catch { return ""; }
  };
  const encPick = (q) => q.seconds + (q.name ? `_${encName(q.name)}` : "");
  const decPick = (tok) => {
    const [secs, name] = tok.split("_");
    const seconds = parseInt(secs, 10);
    if (!(seconds > 0)) return null;
    return {
      seconds: Math.min(MAX_SECONDS, Math.max(MIN_SECONDS, seconds)),
      name: name ? decName(name).trim().slice(0, 40) : "",
    };
  };

  const encode = (st) => {
    const d = defaults();
    const parts = [];
    const quick = st.quick.map(encPick).join("~");
    if (quick !== d.quick.map(encPick).join("~")) parts.push(`q=${quick}`);
    if (st.seconds !== d.seconds || st.name) parts.push(`t=${encPick(st)}`);
    if (st.target) parts.push(`d=${Math.round(st.target / 1000)}`);
    if (st.hex !== d.hex) parts.push(`c=${shortHex(st.hex)}`);
    if (!(st.sound && st.showTime)) parts.push(`o=${st.sound ? "s" : ""}${st.showTime ? "n" : ""}`);
    parts.push(`l=${st.lang === "auto" ? browserLang() : st.lang}`);
    if (st.theme === "hacker") parts.push("h=1");
    return parts.join("&");
  };

  const decode = (hash) => {
    const st = defaults();
    for (const part of hash.split("&")) {
      const i = part.indexOf("=");
      if (i < 0) continue;
      const k = part.slice(0, i), v = part.slice(i + 1);
      if (k === "q") {
        st.quick = v.split("~").map(decPick).filter(Boolean).slice(0, MAX_QUICK).sort((a, b) => a.seconds - b.seconds);
      } else if (k === "d" && parseInt(v, 10) > 0) {
        st.target = parseInt(v, 10) * 1000;
        st.from = Date.now();
      } else if (k === "t") {
        const p = decPick(v);
        if (p) Object.assign(st, p);
      } else if (k === "c" && parseHex(v)) {
        st.hex = parseHex(v);
      } else if (k === "o") {
        st.sound = v.includes("s");
        st.showTime = v.includes("n");
      } else if (k === "l" && I18N[v]) {
        st.lang = v;
      } else if (k === "h") {
        st.theme = v === "1" ? "hacker" : "default";
      }
    }
    return st;
  };

  const shareUrl = () => {
    const hash = encode(settings);
    return location.href.split("#")[0] + (hash ? `#${hash}` : "");
  };

  // Reads a share link from the address bar, if any, and strips it.
  const takeHash = () => {
    if (location.hash.length <= 1) return null;
    const st = decode(location.hash.slice(1));
    history.replaceState(null, "", location.href.split("#")[0]);
    return st;
  };

  const linked = takeHash();
  let settings = linked || load();
  const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));

  const $ = (sel) => document.querySelector(sel);
  const stage = $("#stage");
  const ring = $("#ring");
  const bar = ring.querySelector(".bar");
  const timeEl = $("#time");
  const hint = $("#hint");
  const doneEl = $("#done");
  const controls = $("#controls");
  const scrim = $("#scrim");

  // ---------- i18n ----------

  const browserLang = () =>
    (navigator.languages || [navigator.language]).some((l) => /^(no|nb|nn)\b/i.test(l)) ? "no" : "en";
  const lang = () => (settings.lang === "auto" ? browserLang() : settings.lang);
  const t = (k) => I18N[lang()][k] ?? I18N.en[k] ?? k;

  const applyI18n = () => {
    document.documentElement.lang = lang();
    document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
    document.querySelectorAll("[data-i18n-html]").forEach((el) => (el.innerHTML = t(el.dataset.i18nHtml)));
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => (el.placeholder = t(el.dataset.i18nPlaceholder)));
    document.querySelectorAll("[data-i18n-title]").forEach((el) => {
      el.title = t(el.dataset.i18nTitle);
      el.setAttribute("aria-label", el.title);
    });
  };

  // ---------- Color helpers ----------

  const isLight = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255].map((v) => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.35;
  };

  // The hacker theme is green on black whatever color is picked.
  const HACKER_GREEN = "#00ff41";
  const hacker = () => settings.theme === "hacker";
  const ringHex = () => (hacker() ? HACKER_GREEN : settings.hex);
  const doneHex = () => (hacker() ? "#000000" : settings.hex);

  const paint = (hex, x, y) => {
    const splash = document.createElement("div");
    splash.className = "splash";
    splash.style.background = hex;
    splash.style.setProperty("--x", `${x ?? innerWidth / 2}px`);
    splash.style.setProperty("--y", `${y ?? innerHeight / 2}px`);
    stage.after(splash);
    splash.addEventListener("animationend", () => {
      stage.style.transition = "none";
      stage.style.backgroundColor = hex;
      stage.offsetWidth;
      stage.style.transition = "";
      splash.remove();
    });
    document.body.classList.toggle("light", isLight(hex));
    document.querySelector('meta[name="theme-color"]').content = hex;
  };

  // ---------- Timer ----------
  //
  // "idle" → set up, not started; "running"; "paused"; "done" → time is up.
  // Time left is always worked out from `endAt`, never counted down, so a
  // throttled background tab can't make the timer drift. requestAnimationFrame
  // only draws; finishing has its own timeout, which runs in the background too.

  // A date & time target follows the wall clock instead: it can't be paused,
  // is live while idle too, celebrates once at zero and then keeps counting,
  // negative. `celebrated` says whether zero has been passed already.

  const fromSettings = () => ({ seconds: settings.seconds, name: settings.name, target: settings.target, from: settings.from });
  // The timer that's set up now: a quick pick, a custom time, or a target.
  let current = fromSettings();
  let celebrated = false;
  let state = "idle";
  let total = current.seconds * 1000;
  let left = total;   // ms left, while idle or paused
  let endAt = 0;      // Date.now() when time is up, while running
  let doneTimer = null;
  let frame = null;
  let shownSecond = null;

  const C = 2 * Math.PI * 86;

  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const p2 = (n) => String(n).padStart(2, "0");
  const fmtLong = (s) => {
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    if (d) return `${d}d ${p2(h)}:${p2(m)}:${p2(s % 60)}`;
    return h ? `${h}:${p2(m)}:${p2(s % 60)}` : fmt(s);
  };

  const isTarget = () => !!current.target;

  // Signed for a target: negative once it has passed.
  const remaining = () => {
    if (isTarget()) return current.target - Date.now();
    return state === "running" ? Math.max(0, endAt - Date.now()) : left;
  };

  let shownText = "";
  const draw = () => {
    const ms = remaining();
    const p = total > 0 ? Math.min(1, Math.max(0, ms / total)) : 0;
    // The colored arc runs from its edge clockwise up to twelve o'clock, and
    // the edge sweeps clockwise like a clock hand eating it up.
    bar.style.strokeDasharray = `${C * p} ${C}`;
    bar.style.strokeDashoffset = `${-C * (1 - p)}`;
    ring.classList.toggle("empty", ms <= 0);
    // Whole seconds, rounded up before zero and down after, so it shows 0:00 once.
    const s = ms > 0 ? Math.ceil(ms / 1000) : -Math.floor(-ms / 1000);
    if (s !== shownSecond) {
      shownSecond = s;
      const f = isTarget() ? fmtLong : fmt;
      shownText = s < 0 ? `-${f(-s)}` : f(s);
      timeEl.textContent = shownText;
      timeEl.classList.toggle("over", s < 0);
      timeEl.style.setProperty("--fs", Math.min(0.2, 1.05 / shownText.length));
      $("#done-count").textContent = isTarget() ? shownText : "";
      if (state === "running" && s <= 10 && s > 0) {
        ring.classList.remove("beat");
        ring.offsetWidth; // restart the beat
        ring.classList.add("beat");
      }
      renderTitle();
    }
  };

  const loop = () => {
    draw();
    if (isTarget()) {
      if (remaining() <= 0 && !celebrated) finish();
      frame = requestAnimationFrame(loop);
    } else if (state === "running") {
      if (remaining() <= 0) finish();
      else frame = requestAnimationFrame(loop);
    }
  };

  const setState = (s) => {
    state = s;
    document.body.dataset.state = s;
    $("#restart").hidden = s === "idle";
    // Running hides the hint, so it keeps whatever it said.
    if (s !== "running") hint.innerHTML = t({ idle: isTarget() ? "hintShow" : "hintStart", paused: "hintPaused", done: "hintDone" }[s]);
    renderTitle();
  };

  // setTimeout fires at once for delays over ~24.8 days, so long waits re-arm.
  const armTarget = () => {
    clearTimeout(doneTimer);
    const ms = remaining();
    if (ms > 0) doneTimer = setTimeout(() => (remaining() > 0 ? armTarget() : finish()), Math.min(ms + 20, 2 ** 31 - 1));
  };

  const start = () => {
    unlockAudio();
    keepAwake();
    if (isTarget()) return setState("running"); // already live
    endAt = Date.now() + left;
    setState("running");
    clearTimeout(doneTimer);
    doneTimer = setTimeout(finish, left + 20);
    cancelAnimationFrame(frame);
    loop();
  };

  const pause = () => {
    left = remaining();
    clearTimeout(doneTimer);
    cancelAnimationFrame(frame);
    setState("paused");
    draw();
  };

  const finish = () => {
    if (remaining() > 0) return;
    if (isTarget()) {
      if (celebrated) return;
      celebrated = true;
    } else {
      if (state !== "running") return;
      cancelAnimationFrame(frame);
      left = 0;
    }
    clearTimeout(doneTimer);
    setState("done");
    draw();
    paintDone();
    doneEl.classList.remove("show");
    doneEl.offsetWidth; // restart the pop animation
    doneEl.classList.add("show");
    celebrate();
    chime();
  };

  const paintDone = () => {
    paint(doneHex());
    // The hacker theme colors it in CSS.
    doneEl.style.color = hacker() ? "" : isLight(settings.hex) ? "rgba(0,0,0,0.78)" : "rgba(255,255,255,0.92)";
  };

  const reset = (x, y) => {
    clearTimeout(doneTimer);
    cancelAnimationFrame(frame);
    const wasDone = state === "done";
    doneEl.classList.remove("show");
    shownSecond = null;
    if (isTarget()) {
      total = Math.max(0, current.target - current.from);
      celebrated = remaining() <= 0;
      setState("idle");
      armTarget();
      loop();
      keepAwake();
    } else {
      total = left = current.seconds * 1000;
      setState("idle");
      draw();
    }
    if (wasDone) paint("#000000", x, y);
  };

  // Classic space invader sprites, one row per string, `X` = a lit pixel.
  const INVADERS = [
    ["..X.....X..", "...X...X...", "..XXXXXXX..", ".XX.XXX.XX.", "XXXXXXXXXXX", "X.XXXXXXX.X", "X.X.....X.X", "...XX.XX..."],
    ["...XX...", "..XXXX..", ".XXXXXX.", "XX.XX.XX", "XXXXXXXX", "..X..X..", ".X.XX.X.", "X.X..X.X"],
    ["....XXXX....", ".XXXXXXXXXX.", "XXXXXXXXXXXX", "XXX..XX..XXX", "XXXXXXXXXXXX", "...XX..XX...", "..XX.XX.XX..", "XX........XX"],
  ].map((rows) => {
    const w = rows[0].length, h = rows.length;
    const px = rows.flatMap((r, y) => [...r].map((c, x) => (c === "X" ? `M${x} ${y}h1v1h-1z` : ""))).join("");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges"><path d="${px}"/></svg>`;
    return { ar: `${w} / ${h}`, mask: `url("data:image/svg+xml,${encodeURIComponent(svg)}")` };
  });

  const celebrate = () => {
    const colors = hacker() ? ["#00ff41", "#33ff66", "#9dff00", "#1fae48", "#c9ffd9"] : Object.values(PRESETS);
    const spread = Math.max(innerWidth, innerHeight) * 0.6;
    for (let i = 0; i < 36; i++) {
      const dot = document.createElement("span");
      dot.className = "confetti";
      const a = Math.random() * Math.PI * 2;
      const d = spread * (0.35 + Math.random() * 0.65);
      dot.style.setProperty("--dx", `${Math.cos(a) * d}px`);
      dot.style.setProperty("--dy", `${Math.sin(a) * d}px`);
      if (hacker()) {
        const inv = INVADERS[i % INVADERS.length];
        dot.classList.add("invader");
        dot.style.setProperty("--m", inv.mask);
        dot.style.setProperty("--ar", inv.ar);
        dot.style.setProperty("--s", `${1.6 + Math.random() * 1.8}rem`);
      } else {
        dot.style.setProperty("--s", `${0.8 + Math.random() * 1.8}rem`);
      }
      // Skip the background's own color, it would be invisible.
      dot.style.setProperty("--c", colors.filter((c) => c !== doneHex())[i % (colors.length - 1)]);
      dot.style.animationDelay = `${Math.random() * 0.15}s`;
      dot.addEventListener("animationend", () => dot.remove());
      document.body.append(dot);
    }
  };

  const advance = (x, y) => {
    if (scrim.classList.contains("open") || customEl.classList.contains("open")) return;
    if (state === "idle" || state === "paused") start();
    else if (state === "running") { if (!isTarget()) pause(); }
    else reset(x, y);
  };

  stage.addEventListener("click", (e) => advance(e.clientX, e.clientY));

  $("#restart").addEventListener("click", () => reset());

  document.addEventListener("keydown", (e) => {
    if (customEl.classList.contains("open")) {
      if (e.key === "Escape") closeCustom();
      return;
    }
    if (scrim.classList.contains("open")) {
      if (e.key === "Escape") closeSettings();
      return;
    }
    // Leave shortcuts like Ctrl/Cmd+R (reload) to the browser.
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (!e.repeat) advance();
    } else if ((e.key === "Escape" || e.key === "Backspace" || e.key.toLowerCase() === "r") && state !== "idle") {
      e.preventDefault();
      reset();
    }
  });

  // Coming back to a tab whose time ran out while it was hidden.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (state === "running" || isTarget()) {
      cancelAnimationFrame(frame);
      loop();
    }
    if (state === "running" || state === "paused" || isTarget()) keepAwake();
  });

  // ---------- Sound ----------
  //
  // Browsers (iOS especially) only let audio start from a tap or key press,
  // so the context is created or resumed when the timer is started — by the
  // time it rings, nobody is touching the screen.

  let audio = null;
  const unlockAudio = () => {
    if (!settings.sound) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio ??= new AC();
    if (audio.state === "suspended") audio.resume();
  };

  // A saved target after a reload has had no tap yet; any tap will do.
  document.addEventListener("pointerdown", () => isTarget() && unlockAudio(), { passive: true });

  const chime = () => {
    if (!settings.sound || !audio) return;
    // iOS may have suspended it during a long timer.
    if (audio.state !== "running") audio.resume();
    const t0 = audio.currentTime + 0.05;
    if (hacker()) return chiptune(t0);
    const notes = [523.25, 659.25, 783.99, 1046.5];
    [0, 0.9].forEach((offset) => notes.forEach((f, i) => {
      const at = t0 + offset + i * 0.13;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = "sine";
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, at);
      gain.gain.linearRampToValueAtTime(0.28, at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, at + 0.8);
      osc.connect(gain).connect(audio.destination);
      osc.start(at);
      osc.stop(at + 0.85);
    }));
  };

  // The hacker theme's 8-bit "stage clear": square-wave notes, hard on and off.
  const chiptune = (t0) => {
    const tune = [
      [783.99, 0.09], [1046.5, 0.09], [1318.51, 0.09], [1567.98, 0.09], [1318.51, 0.09], [1567.98, 0.4],
      [0, 0.12],
      [1046.5, 0.09], [1318.51, 0.09], [1567.98, 0.09], [2093, 0.5],
    ];
    let at = t0;
    for (const [f, len] of tune) {
      if (f) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = "square";
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.09, at);
        gain.gain.setValueAtTime(0, at + len * 0.9);
        osc.connect(gain).connect(audio.destination);
        osc.start(at);
        osc.stop(at + len);
      }
      at += len;
    }
  };

  // ---------- Idle controls ----------

  let idleTimer;
  const wake = () => {
    controls.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => controls.classList.add("idle"), 3000);
  };
  ["mousemove", "pointerdown"].forEach((ev) => document.addEventListener(ev, wake, { passive: true }));
  wake();

  // ---------- Fullscreen & wake lock ----------

  const fsBtn = $("#fullscreen");
  if (!document.documentElement.requestFullscreen) fsBtn.hidden = true;
  fsBtn.addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    fsBtn.querySelector(".enter").style.display = on ? "none" : "";
    fsBtn.querySelector(".exit").style.display = on ? "" : "none";
  });

  let wakeLock = null;
  const keepAwake = async () => {
    if (wakeLock || !navigator.wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => (wakeLock = null));
    } catch {}
  };

  // ---------- Presets & settings ----------

  const clampSeconds = (s) => Math.min(MAX_SECONDS, Math.max(MIN_SECONDS, s));

  // Presets only show while idle, so this never touches a timer that's going.
  const pick = (seconds, name = "", target = null) => {
    // Keep where the ring started if only the name changed.
    const from = target && target === current.target ? current.from : Date.now();
    current = { seconds: clampSeconds(seconds), name: name.trim(), target, from: target ? from : null };
    Object.assign(settings, current);
    save();
    reset();
    renderPresets();
    renderName();
  };

  const presetsEl = $("#presets");
  const customBtn = document.createElement("button");
  customBtn.id = "custom-btn";
  customBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg><small data-i18n="custom"></small>';
  customBtn.addEventListener("click", () => openEditor({
    title: t("customTitle"),
    yes: t("use"),
    // Start from what's set up if it's already custom, else a blank-named copy.
    value: isQuick() ? { seconds: current.seconds, name: "" } : current,
    onSave: (v) => {
      unlockAudio(); // a tap, so a target can ring later
      pick(v.seconds, v.name, v.target);
    },
    allowTarget: true,
    returnTo: customBtn,
  }));

  const same = (q) => !current.target && q.seconds === current.seconds && q.name === current.name;
  const isQuick = () => settings.quick.some(same);

  // Big number plus a small unit (or the name) underneath, for the round buttons.
  const presetFace = (b, q) => {
    const m = Math.floor(q.seconds / 60), s = q.seconds % 60;
    const small = document.createElement("small");
    small.textContent = q.name || (s && !m ? t("sec") : t("min"));
    b.textContent = s && !m ? s : s ? fmt(q.seconds) : m;
    b.classList.toggle("long", !!s && !!m);
    b.append(small);
    b.title = q.name ? `${q.name} · ${fmt(q.seconds)}` : fmt(q.seconds);
  };

  const renderPresets = () => {
    presetsEl.replaceChildren(...settings.quick.map((q) => {
      const b = document.createElement("button");
      presetFace(b, q);
      b.setAttribute("aria-pressed", same(q));
      b.addEventListener("click", () => pick(q.seconds, q.name));
      return b;
    }), customBtn);
    customBtn.querySelector("small").textContent = t("custom");
    customBtn.setAttribute("aria-pressed", !isQuick());
  };

  const targetLabel = () => new Intl.DateTimeFormat(lang() === "no" ? "nb" : "en", {
    weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
  }).format(current.target);

  const renderName = () => {
    // An unnamed target is labelled with its date and time.
    const label = current.name || (isTarget() ? targetLabel() : "");
    $("#label").textContent = label;
    $("#done-name").textContent = label;
    document.body.classList.toggle("named", !!label);
    renderTitle();
  };

  // Minutes and seconds steppers (with typing) inside `root`; get/set work in seconds.
  const timeEditor = (root, get, set) => {
    const minIn = root.querySelector("input.min");
    const secIn = root.querySelector("input.sec");
    const step = (d) => root.querySelector(`[data-step="${d}"]`);
    const render = () => {
      const v = get(), m = Math.floor(v / 60), s = v % 60;
      minIn.value = m;
      secIn.value = String(s).padStart(2, "0");
      step(-60).disabled = v - 60 < MIN_SECONDS;
      step(60).disabled = v + 60 > MAX_SECONDS;
      step(-5).disabled = s < 5 || v - 5 < MIN_SECONDS;
      step(5).disabled = s + 5 > 59 || v + 5 > MAX_SECONDS;
    };
    root.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => {
      set(clampSeconds(get() + +b.dataset.step));
      render();
    }));
    const typed = () => {
      const m = Math.min(99, parseInt(minIn.value, 10) || 0);
      const s = Math.min(59, parseInt(secIn.value, 10) || 0);
      set(clampSeconds(m * 60 + s));
      render();
    };
    [minIn, secIn].forEach((el) => {
      el.addEventListener("change", typed);
      el.addEventListener("focus", () => el.select());
    });
    return render;
  };

  // ---------- Time editor dialog ----------
  //
  // Used for the custom time and for adding or changing a quick pick.

  const customEl = $("#custom");
  const customForm = customEl.querySelector("form");
  let draft = 0;
  let editing = null;
  const renderDraft = timeEditor(customForm, () => draft, (v) => (draft = v));

  const modeEl = $("#custom-mode");
  const whenEl = $("#custom-when");
  let mode = "duration";
  // datetime-local wants local time as YYYY-MM-DDTHH:MM.
  const toLocal = (ms) => {
    const d = new Date(ms);
    return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
  };
  const setMode = (m) => {
    mode = m;
    customForm.querySelectorAll(".dur").forEach((r) => (r.hidden = m !== "duration"));
    customForm.querySelector(".when").hidden = m !== "target";
    requestAnimationFrame(() => setSegmented(modeEl, m));
  };
  modeEl.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) setMode(b.dataset.value);
  });

  const openEditor = (opts) => {
    editing = opts;
    draft = opts.value.seconds;
    $("#custom-name").value = opts.value.name;
    $("#custom-title").textContent = opts.title;
    $("#custom-yes").textContent = opts.yes;
    // Default target: the next whole hour.
    const nextHour = new Date();
    nextHour.setHours(nextHour.getHours() + 1, 0, 0, 0);
    whenEl.value = toLocal(opts.value.target || nextHour.getTime());
    modeEl.hidden = !opts.allowTarget;
    renderDraft();
    customEl.classList.add("open");
    setMode(opts.allowTarget && opts.value.target ? "target" : "duration");
    (mode === "target" ? whenEl : customForm.querySelector("input.min")).focus();
  };
  const closeCustom = () => {
    customEl.classList.remove("open");
    editing?.returnTo?.focus({ preventScroll: true });
    editing = null;
  };
  customForm.addEventListener("submit", (e) => {
    e.preventDefault();
    // Enter in a number field submits before its change event; read it first.
    document.activeElement?.dispatchEvent?.(new Event("change"));
    let target = null;
    if (mode === "target") {
      target = new Date(whenEl.value).getTime();
      if (!whenEl.value || Number.isNaN(target)) return whenEl.focus();
    }
    const { onSave } = editing;
    closeCustom();
    onSave({ seconds: draft, name: $("#custom-name").value.trim(), target });
  });
  $("#custom-no").addEventListener("click", closeCustom);
  customEl.addEventListener("click", (e) => { if (e.target === customEl) closeCustom(); });

  // ---------- Quick picks in settings ----------

  const quickList = $("#quick-list");
  const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>';
  const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>';

  const setQuick = (list) => {
    settings.quick = list.sort((a, b) => a.seconds - b.seconds);
    save();
    renderPresets();
    renderQuickList();
  };

  const renderQuickList = () => {
    const rows = settings.quick.map((q, i) => {
      const row = document.createElement("div");
      row.className = "row";
      const edit = document.createElement("button");
      edit.className = "edit";
      edit.innerHTML = '<span class="dot"></span><b></b><span></span>';
      edit.querySelector("b").textContent = fmt(q.seconds);
      edit.querySelector("span:last-child").textContent = q.name;
      edit.addEventListener("click", () => openEditor({
        title: t("quickPick"),
        yes: t("save"),
        value: q,
        onSave: (v) => setQuick(settings.quick.map((x, j) => (j === i ? v : x))),
        returnTo: edit,
      }));
      const del = document.createElement("button");
      del.className = "round";
      del.innerHTML = CROSS;
      del.title = t("remove");
      del.setAttribute("aria-label", `${t("remove")} ${fmt(q.seconds)}`);
      del.addEventListener("click", () => setQuick(settings.quick.filter((_, j) => j !== i)));
      row.append(edit, del);
      return row;
    });
    if (settings.quick.length < MAX_QUICK) {
      const row = document.createElement("div");
      row.className = "row";
      const add = document.createElement("button");
      add.className = "edit add";
      add.innerHTML = `<span class="round">${PLUS}</span>`;
      add.append(t("add"));
      add.addEventListener("click", () => openEditor({
        title: t("quickPick"),
        yes: t("add"),
        value: { seconds: current.seconds, name: "" },
        onSave: (v) => setQuick([...settings.quick, v]),
        returnTo: add,
      }));
      row.append(add);
      rows.push(row);
    }
    quickList.replaceChildren(...rows);
  };

  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const palette = $(".palette");
  for (const [key, hex] of Object.entries(PRESETS)) {
    const b = document.createElement("button");
    b.dataset.hex = hex;
    b.dataset.key = key;
    b.style.setProperty("--c", hex);
    b.style.setProperty("--ink", isLight(hex) ? "#000" : "#fff");
    b.innerHTML = check;
    b.addEventListener("click", () => {
      settings.hex = hex;
      save();
      renderColor();
    });
    palette.append(b);
  }

  const renderColor = () => {
    if (hacker()) document.documentElement.dataset.theme = "hacker";
    else delete document.documentElement.dataset.theme;
    $("#palette-section").hidden = hacker();
    document.body.style.setProperty("--c", ringHex());
    document.body.style.setProperty("--ink", isLight(ringHex()) ? "#17161f" : "#fff");
    palette.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", b.dataset.hex === settings.hex);
      b.title = t(b.dataset.key);
      b.setAttribute("aria-label", b.title);
    });
  };

  const setSegmented = (el, value) => {
    const thumb = el.querySelector(".thumb");
    el.querySelectorAll("button").forEach((b) => {
      const on = b.dataset.value === value;
      b.setAttribute("aria-pressed", on);
      if (on) {
        thumb.style.left = `${b.offsetLeft}px`;
        thumb.style.width = `${b.offsetWidth}px`;
      }
    });
  };

  const renderOptions = () => {
    renderQuickList();
    $("#sound").setAttribute("aria-pressed", settings.sound);
    $("#show-time").checked = settings.showTime;
    timeEl.classList.toggle("hide", !settings.showTime);
    // Segmented thumbs measure their buttons, so they need the sheet laid out.
    requestAnimationFrame(() => {
      setSegmented($("#lang"), settings.lang);
      setSegmented($("#theme"), settings.theme);
    });
  };

  const renderTitle = () => {
    document.title = state === "running" || state === "paused" || isTarget()
      ? `${shownText} · ${current.name || t("appName")}`
      : "Nedtelling · Countdown";
  };

  const renderAll = () => {
    applyI18n();
    setState(state);
    renderPresets();
    renderName();
    renderColor();
    renderOptions();
    renderInstallHint();
  };

  const openSettings = () => {
    scrim.classList.add("open");
    renderAll();
  };

  const closeSettings = () => {
    scrim.classList.remove("open");
    $("#gear").focus({ preventScroll: true });
  };

  $("#gear").addEventListener("click", openSettings);
  $("#close").addEventListener("click", closeSettings);
  scrim.addEventListener("click", (e) => { if (e.target === scrim) closeSettings(); });

  $("#sound").addEventListener("click", () => {
    settings.sound = !settings.sound;
    save();
    renderOptions();
    // A little preview, which also unlocks audio from this tap.
    if (settings.sound) {
      unlockAudio();
      chime();
    }
  });
  $("#show-time").addEventListener("change", (e) => { settings.showTime = e.target.checked; save(); renderOptions(); });

  $("#theme").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    settings.theme = b.dataset.value;
    save();
    renderAll();
    if (state === "done") paintDone();
  });

  $("#lang").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    settings.lang = b.dataset.value;
    save();
    renderAll();
  });

  // ---------- Dialog ----------

  const confirmEl = $("#confirm");
  const RESET_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4.5H8"/></svg>';

  const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>';

  // Resolves true (yes) or false (no / Escape / backdrop). `onYes` may return
  // false to keep the dialog open. Focus starts on the field if there is one,
  // otherwise on "no", so an accidental Enter is harmless.
  const dialog = ({ tone = "danger", icon, title, text, field, yes, no = t("cancel"), onYes }) =>
    new Promise((resolve) => {
      const fieldEl = $("#confirm-field");
      const yesEl = $("#confirm-yes");
      const noEl = $("#confirm-no");
      confirmEl.dataset.tone = tone;
      confirmEl.querySelector(".badge").innerHTML = icon;
      $("#confirm-title").textContent = title;
      $("#confirm-text").textContent = text;
      fieldEl.hidden = field == null;
      fieldEl.value = field ?? "";
      yesEl.textContent = yes;
      yesEl.className = `pill ${tone === "danger" ? "danger" : ""}`;
      noEl.textContent = no;
      const returnFocus = document.activeElement;
      confirmEl.classList.add("open");
      if (field != null) {
        fieldEl.focus();
        fieldEl.select();
      } else {
        noEl.focus();
      }

      const done = (answer) => {
        confirmEl.classList.remove("open");
        confirmEl.removeEventListener("click", onClick);
        document.removeEventListener("keydown", onKey, true);
        returnFocus?.focus({ preventScroll: true });
        resolve(answer);
      };
      const onClick = async (e) => {
        if (e.target.closest("#confirm-yes")) {
          if (!onYes || (await onYes(yesEl)) !== false) done(true);
        } else if (e.target.closest("#confirm-no") || e.target === confirmEl) {
          done(false);
        }
      };
      const onKey = (e) => {
        // Don't let Escape also close settings, or Space start the timer.
        e.stopPropagation();
        if (!confirmEl.contains(e.target) && e.key !== "Escape" && e.key !== "Tab") e.preventDefault();
        if (e.key === "Escape") done(false);
        // Keep Tab inside the dialog.
        if (e.key === "Tab") {
          e.preventDefault();
          const stops = [fieldEl, noEl, yesEl].filter((el) => !el.hidden);
          const i = stops.indexOf(document.activeElement);
          stops[(i + (e.shiftKey ? -1 : 1) + stops.length) % stops.length].focus();
        }
      };
      confirmEl.addEventListener("click", onClick);
      // Capture on document so keys are ours wherever focus ended up.
      document.addEventListener("keydown", onKey, true);
    });

  $("#share").addEventListener("click", async () => {
    const url = shareUrl();
    const btn = $("#share");
    // Native share sheet on phones/tablets; clipboard elsewhere; and if both
    // fail, a dialog with the link ready to copy by hand.
    if (navigator.share && matchMedia("(pointer: coarse)").matches) {
      try {
        await navigator.share({ title: t("appName"), url });
        return;
      } catch (err) {
        if (err.name === "AbortError") return; // closed the share sheet
      }
    }
    try {
      await navigator.clipboard.writeText(url);
      btn.textContent = t("copied");
      setTimeout(() => (btn.textContent = t("share")), 2000);
    } catch {
      showLink(url);
    }
  });

  const showLink = (url) => dialog({
    tone: "accent",
    icon: LINK_ICON,
    title: t("linkTitle"),
    text: t("linkText"),
    field: url,
    no: t("close"),
    yes: t("copy"),
    // Older copy path, from the selected field; keep the dialog open to say so.
    onYes: async (yesBtn) => {
      const field = $("#confirm-field");
      field.focus();
      field.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch {}
      if (!ok) return false;
      yesBtn.textContent = t("copied");
      await new Promise((r) => setTimeout(r, 900));
      return true;
    },
  });

  $("#reset").addEventListener("click", async () => {
    const ok = await dialog({ icon: RESET_ICON, title: t("confirmReset"), text: t("confirmResetText"), yes: t("reset") });
    if (!ok) return;
    apply(defaults());
  });

  // Replaces all settings (reset, or a share link) and sets up its picked time.
  const apply = (st) => {
    settings = st;
    save();
    current = fromSettings();
    reset();
    renderAll();
  };

  // After loading a link, offer to go back to what this device had before.
  const toast = $("#toast");
  let toastTimer;
  const announceLoaded = (previous) => {
    toast.querySelector("span").textContent = t("loaded");
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 6000);
    $("#undo").onclick = () => {
      toast.classList.remove("show");
      apply(previous);
    };
  };

  // Opening another link in an already open tab.
  addEventListener("hashchange", () => {
    const previous = settings;
    const st = takeHash();
    if (!st) return;
    apply(st);
    announceLoaded(previous);
  });

  // Another tab changed the settings; adopt them so our next save doesn't undo that.
  addEventListener("storage", (e) => {
    if (e.key !== STORAGE_KEY) return;
    settings = load();
    renderAll();
  });

  // ---------- Install as an app ----------

  // Chrome, Edge and Android offer an install prompt we can trigger from our
  // own button. iOS has none, so there we explain the Share-menu route instead.
  let installPrompt = null;
  const installBtn = $("#install");
  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    installPrompt = e;
    installBtn.hidden = false;
  });
  installBtn.addEventListener("click", async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    installBtn.hidden = true;
  });
  addEventListener("appinstalled", () => (installBtn.hidden = true));

  const iosShareIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M6 11H5v10h14V11h-1"/></svg>';
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const installed = navigator.standalone || matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
  const renderInstallHint = () => {
    const hint = $("#ios-install");
    hint.hidden = !isIOS || installed;
    // Our own static string with an icon; no user text goes in here.
    hint.innerHTML = t("iosInstall").replace("{share}", iosShareIcon);
  };

  if ("serviceWorker" in navigator && isSecureContext && location.protocol !== "file:") {
    addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }

  // ---------- Boot ----------

  setState("idle");
  reset();
  renderAll();
  if (linked) {
    const previous = load();
    save();
    announceLoaded(previous);
  }
})();
</script>
</body>
</html>
